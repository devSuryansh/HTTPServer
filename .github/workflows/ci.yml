name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: install compilers
        run: sudo apt-get update && sudo apt-get install -y build-essential clang
      - name: build and test
        env:
          CC: ${{ matrix.cc }}
        run: |
          make asan
          make test
